[package]
name = "sidetype-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "SideType WebSocket server: pairing, tokens, and injection."

[dependencies]
sidetype-protocol.workspace = true
sidetype-inject.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
sha2 = "0.11"
getrandom = "0.4"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
