[workspace]
resolver = "2"
members = [
    "crates/sidetype-protocol",
    "crates/sidetype-inject",
    "crates/sidetype-inject-cli",
    "crates/sidetype-server",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sidetype-protocol = { path = "crates/sidetype-protocol" }
sidetype-inject = { path = "crates/sidetype-inject" }
sidetype-server = { path = "crates/sidetype-server" }
