name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        working-directory: desktop
        run: cargo fmt --check
      - name: clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: desktop
        run: cargo test
