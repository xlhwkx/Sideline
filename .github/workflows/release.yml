name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo install tauri-cli --version "^2.12" --locked
      - run: cargo tauri build --bundles nsis
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/target/release/bundle/nsis/*-setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: 按版本号命名
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # 安装包的文件名里已经有版本号，只需要给 APK 改名。
          mv dist/app-debug.apk "dist/Sideline_${tag}.apk"
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Sideline_*_x64-setup.exe
            dist/Sideline_*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
